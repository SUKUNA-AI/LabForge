name: labforge-task-service

services:
  task-db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-labforge_task_service}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - task_db_data:/var/lib/postgresql

  task-service:
    build:
      context: ../../..
      dockerfile: services/task-service/docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@task-db:5432/${POSTGRES_DB:-labforge_task_service}
      SQL_ECHO: ${SQL_ECHO:-false}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
    depends_on:
      task-db:
        condition: service_healthy
    ports:
      - "${TASK_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  task_db_data:
