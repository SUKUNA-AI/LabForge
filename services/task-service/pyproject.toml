[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "labforge-task-service"
version = "0.1.0"
description = "LabForge task service"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "httpx",
    "pydantic",
    "python-dotenv",
    "sqlalchemy",
    "uvicorn[standard]",
]

[tool.setuptools.packages.find]
where = ["src"]
